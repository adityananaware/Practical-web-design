<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Arithmetic Operations</title>
</head>

<body>

    <h2>Check your browser Console (Press F12)</h2>

    <script>
        var a = parseFloat(prompt("Please enter First Number:"));
        var b = parseFloat(prompt("Please enter Second Number:"));

        console.log(`Addition of ${a} & ${b} is: ${a + b}`);
        console.log(`Subtraction of ${a} & ${b} is: ${a - b}`);
        console.log(`Multiplication of ${a} & ${b} is: ${a * b}`);
        console.log(`Division of ${a} & ${b} is: ${a / b}`);
        console.log(`Remainder of ${a} & ${b} is: ${a % b}`);
        console.log(`Square of ${a} is: ${a ** 2}`);
        console.log(`Square of ${b} is: ${b ** 2}`);

        alert(`Incrementing a: ${a} -> ${++a}`);
        alert(`Decrementing b: ${b} -> ${--b}`);
    </script>

</body>
</html>
